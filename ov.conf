{
  "server": { "host": "0.0.0.0", "port": 1933, "auth_mode": "api_key", "root_api_key": "${OV_ROOT_API_KEY}" },
  "storage": { "workspace": "/app/.openviking/data", "agfs": { "backend": "local" }, "vectordb": { "backend": "local", "name": "context_qwen3_query_instruct_v1" } },
  "embedding": {
    "max_concurrent": 1,
    "max_retries": 0,
    "max_input_tokens": 1000000,
    "allow_metadata_override": false,
    "dense": {
      "provider": "openai", "api_base": "http://embedding:8080/v1", "api_key": "${EMBEDDING_API_KEY}",
      "model": "memory-embedding-qwen3-v1", "dimension": 1024, "input": "text", "encoding_format": "float",
      "query_param": "query", "document_param": "document"
    }
  },
  "vlm": {
    "provider": "openai", "api_base": "http://llm-adapter:4010/v1", "api_key": "${LLM_API_KEY}",
    "model": "memory-default", "temperature": 0, "reasoning_effort": "none", "max_tokens": 32768,
    "max_concurrent": 1, "max_retries": 0, "timeout": 180
  }
}
