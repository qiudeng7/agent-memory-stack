# Maintainer-only build recipe. This file is not shipped in the deployment bundle.
services:
  llm-adapter:
    image: agent-memory-stack-llm:0.1.0
    build: {context: .., dockerfile: apps/llm-adapter/Dockerfile}
  embedding:
    image: agent-memory-stack-embedding:0.1.0
    build: {context: .., dockerfile: apps/embedding/Dockerfile}
  embedding-engine:
    image: agent-memory-stack-engine:0.1.0
    build: {context: .., dockerfile: deploy/engine.Dockerfile}
  openviking:
    image: agent-memory-stack-openviking:0.1.0
    build: {context: .., dockerfile: deploy/openviking.Dockerfile}
